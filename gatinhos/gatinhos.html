<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gatinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --tile-size: 44px;
    --wood: #8B5A2B;
    --wood-dark: #6E4520;
    --cream: #FFFBF0;
    --ink: #3A2E1F;
    --ink-soft: #6B5A44;
    --coral: #FF6B5B;
    --coral-dark: #E0503F;
    --sun: #FFC93C;
    --grass-1: #BEE3A8;
    --grass-2: #ABD890;
    --leaf: #4E9F3D;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 44px;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 82% 8%, #FFE59A 0%, #FFE59A 7%, transparent 7.5%),
      linear-gradient(#AEE1EE 0%, #CDEFF4 46%, #EAF7DA 46%, #EAF7DA 100%);
    position:relative;
    overflow-x:hidden;
  }
  .cloud{
    position:absolute; top:60px; background:#fff; border-radius:50px;
    opacity:.85; filter:drop-shadow(0 4px 0 rgba(255,255,255,.4));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .cloud1{width:90px;height:32px;left:6%;top:40px;}
  .cloud1::before{width:46px;height:46px;top:-22px;left:10px;}
  .cloud1::after{width:34px;height:34px;top:-14px;left:48px;}
  .cloud2{width:70px;height:26px;right:8%;top:110px;opacity:.7;}
  .cloud2::before{width:34px;height:34px;top:-16px;left:8px;}
  .cloud2::after{width:26px;height:26px;top:-10px;left:36px;}

  .game-card{
    position:relative; z-index:1;
    width:100%; max-width:440px;
    background:var(--cream);
    border:6px solid var(--wood);
    border-radius:30px;
    padding:20px 20px 24px;
    box-shadow:0 10px 0 rgba(110,69,32,.35), 0 22px 34px rgba(58,46,31,.22);
  }

  header{text-align:center; margin-bottom:14px;}
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.2rem;
    margin:0;
    color:var(--ink);
    text-shadow: 2px 2px 0 var(--sun), 4px 4px 0 rgba(58,46,31,.12);
    letter-spacing:.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:.92rem;
    font-weight:600;
  }

  .reset-btn{
    position:absolute; top:14px; right:14px;
    background:none; border:none; cursor:pointer;
    font-size:1.15rem; opacity:.55; padding:4px;
    line-height:1; z-index:2;
  }
  .reset-btn:hover{opacity:.9;}

  .hud{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .pill{
    background:#fff;
    border:2px solid #EADFC8;
    border-radius:14px;
    padding:6px 10px;
    text-align:center;
    font-weight:800;
    font-family:'Baloo 2',sans-serif;
    font-size:.95rem;
    color:var(--ink);
  }
  .pill small{
    display:block;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.2px;
  }
  .goal-box{
    background:#fff;
    border:2px solid #EADFC8;
    border-radius:14px;
    padding:6px 12px;
  }
  .goal-top{
    display:flex; align-items:center; justify-content:space-between;
    font-weight:800; font-family:'Baloo 2',sans-serif; font-size:.95rem;
    margin-bottom:4px;
  }
  .goal-track{
    height:9px; border-radius:6px; background:#F0EADA; overflow:hidden;
  }
  .goal-fill{
    height:100%; background:linear-gradient(90deg,#FF9FB0,var(--coral));
    width:0%; border-radius:6px; transition:width .35s ease;
  }

  .board-wrap{
    position:relative;
    border-radius:20px;
    padding:10px;
    background:
      repeating-linear-gradient(135deg, var(--wood) 0 14px, var(--wood-dark) 14px 28px);
    box-shadow: inset 0 0 0 4px rgba(0,0,0,.08);
  }
  .board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:
      repeating-conic-gradient(var(--grass-1) 0% 25%, var(--grass-2) 0% 50%)
      0 0 / calc(var(--tile-size) * 2 + 12px) calc(var(--tile-size) * 2 + 12px);
    touch-action:none;
  }

  .tile{
    position:absolute;
    top:0; left:0;
    width:var(--tile-size);
    height:var(--tile-size);
    display:flex; align-items:center; justify-content:center;
    border-radius:14px;
    cursor:pointer;
    user-select:none;
    font-size:calc(var(--tile-size) * 0.6);
    transition:transform .26s cubic-bezier(.34,1.56,.64,1), opacity .22s ease, filter .15s ease;
    box-shadow:0 3px 0 rgba(0,0,0,.14), inset 0 0 0 2px rgba(255,255,255,.5);
  }
  .tile.selected{ box-shadow:0 3px 0 rgba(0,0,0,.14), 0 0 0 3px var(--coral), inset 0 0 0 2px rgba(255,255,255,.6); }
  .tile.invalid-shake{ animation: shakeFlash .35s ease; }
  @keyframes shakeFlash{
    0%,100%{ filter:none; }
    30%{ filter:brightness(1.15) saturate(1.3); }
    60%{ filter:brightness(.9); }
  }

  .tile-cat{ background:#FFD8E4; }
  .tile-dog{ background:#F1DABE; }
  .tile-rabbit{ background:#F4F1EA; }
  .tile-fox{ background:#FFE1C2; }
  .tile-panda{ background:#E4E7EA; }
  .tile-frog{ background:#DFF3D8; }

  .overlay{
    position:absolute; inset:0;
    background:rgba(58,46,31,.6);
    display:none; align-items:center; justify-content:center;
    border-radius:14px;
    z-index:5;
  }
  .overlay.show{ display:flex; }
  .overlay-card{
    background:var(--cream);
    border-radius:18px;
    padding:26px 22px;
    text-align:center;
    max-width:78%;
    box-shadow:0 8px 0 rgba(110,69,32,.35);
  }
  .overlay-emoji{ font-size:2.6rem; margin-bottom:4px; }
  .overlay-title{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.3rem; margin:0 0 6px;
  }
  .overlay-text{ font-size:.9rem; color:var(--ink-soft); margin:0 0 16px; font-weight:600; }
  .btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1rem;
    color:#fff;
    background:var(--coral);
    border:none;
    padding:11px 22px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--coral-dark);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--coral-dark); }

  .toast{
    position:absolute;
    left:50%; bottom:14px; transform:translate(-50%, 12px);
    background:var(--ink);
    color:#fff;
    font-weight:700;
    font-size:.82rem;
    padding:8px 16px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:6;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  footer{
    margin-top:16px;
    font-size:.72rem;
    color:var(--ink-soft);
    opacity:.7;
    text-align:center;
  }

  @media (max-width:380px){
    h1{ font-size:1.85rem; }
    .pill{ font-size:.82rem; padding:5px 7px; }
  }
</style>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K55VS4TH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
</head>
<body>
<div class="page">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="game-card">
    <button class="reset-btn" id="resetBtn" title="Recomeçar do nível 1">🔄</button>
    <header>
      <h1>🐾 Gatinhos</h1>
      <p>Junta 3 ou mais animais e liberta os gatinhos!</p>
    </header>

    <div class="hud">
      <div class="pill" id="levelPill">Nível<br><span id="levelValue">1</span></div>
      <div class="goal-box">
        <div class="goal-top">
          <span>🐱 Gatinhos</span>
          <span id="goalCount">0/12</span>
        </div>
        <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
      </div>
      <div class="pill" id="movesPill">Jogadas<br><span id="movesValue">20</span></div>
    </div>

    <div class="hud" style="grid-template-columns:1fr;">
      <div class="pill" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
        <span>⭐ Pontuação</span>
        <span id="scoreValue" style="font-size:1.1rem;">0</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-emoji" id="overlayEmoji">🎉</div>
          <h2 class="overlay-title" id="overlayTitle">Nível completo!</h2>
          <p class="overlay-text" id="overlayText">Libertaste todos os gatinhos.</p>
          <button class="btn" id="overlayBtn">Próximo nível</button>
        </div>
      </div>
      <div class="toast" id="toast">Combo!</div>
    </div>

    <footer>Toca em dois animais vizinhos para os trocar.</footer>
  </div>
</div>

<script>
(function(){
  const COLS = 8, ROWS = 8;
  const ANIMALS = [
    { key:'cat',    emoji:'🐱' },
    { key:'dog',    emoji:'🐶' },
    { key:'rabbit', emoji:'🐰' },
    { key:'fox',    emoji:'🦊' },
    { key:'panda',  emoji:'🐼' },
    { key:'frog',   emoji:'🐸' },
  ];
  const CAT_TYPE = 0;

  const boardEl = document.getElementById('board');
  const overlayEl = document.getElementById('overlay');
  const overlayEmoji = document.getElementById('overlayEmoji');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const toastEl = document.getElementById('toast');
  const levelValue = document.getElementById('levelValue');
  const movesValue = document.getElementById('movesValue');
  const scoreValue = document.getElementById('scoreValue');
  const goalCount = document.getElementById('goalCount');
  const goalFill = document.getElementById('goalFill');
  const resetBtn = document.getElementById('resetBtn');

  let grid = [];
  let cellSize = 0;
  let level = 1, score = 0, movesLeft = 20, catsCollected = 0, goalTarget = 12;
  let selected = null;
  let busy = false;
  let toastTimer = null;

  const wait = (ms) => new Promise(res => setTimeout(res, ms));
  const randType = () => Math.floor(Math.random() * ANIMALS.length);

  function levelConfig(lv){
    return {
      target: 12 + (lv - 1) * 6,
      moves: Math.max(14, 22 - (lv - 1))
    };
  }

  function recalcSize(){
    cellSize = boardEl.clientWidth / COLS;
    document.documentElement.style.setProperty('--tile-size', (cellSize - 6) + 'px');
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++){
        const t = grid[r] && grid[r][c];
        if (t) updateTilePosition(t, false);
      }
  }

  function updateTilePosition(tile, animate){
    const x = tile.col * cellSize + 3;
    const y = tile.row * cellSize + 3;
    const scale = tile.selected ? 1.08 : 1;
    if (!animate){ tile.el.style.transition = 'none'; }
    tile.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    if (!animate){
      tile.el.offsetHeight;
      tile.el.style.transition = '';
    }
  }

  function createTile(row, col, typeIndex, spawnAbove){
    const el = document.createElement('div');
    el.className = 'tile tile-' + ANIMALS[typeIndex].key;
    el.textContent = ANIMALS[typeIndex].emoji;
    const tile = { row, col, type: typeIndex, el, selected:false };

    if (spawnAbove){
      const x = col * cellSize + 3;
      const y = (row - spawnAbove) * cellSize + 3;
      el.style.transition = 'none';
      el.style.transform = `translate(${x}px, ${y}px) scale(1)`;
      boardEl.appendChild(el);
      el.offsetHeight;
      el.style.transition = '';
    } else {
      boardEl.appendChild(el);
      updateTilePosition(tile, false);
    }
    el.addEventListener('click', () => onTileClick(tile));
    return tile;
  }

  function buildBoard(){
    boardEl.innerHTML = '';
    grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
    const types = Array.from({length: ROWS}, () => new Array(COLS).fill(0));

    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        let t;
        do {
          t = randType();
        } while (
          (c >= 2 && types[r][c-1] === t && types[r][c-2] === t) ||
          (r >= 2 && types[r-1][c] === t && types[r-2][c] === t)
        );
        types[r][c] = t;
      }
    }
    recalcSize();
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        const tile = createTile(r, c, types[r][c], ROWS);
        grid[r][c] = tile;
      }
    }
    requestAnimationFrame(() => {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          updateTilePosition(grid[r][c], true);
    });
  }

  function onTileClick(tile){
    if (busy || overlayEl.classList.contains('show')) return;

    if (!selected){
      selected = tile;
      tile.selected = true;
      tile.el.classList.add('selected');
      updateTilePosition(tile, true);
      return;
    }
    if (selected === tile){
      deselect();
      return;
    }
    const dr = Math.abs(selected.row - tile.row);
    const dc = Math.abs(selected.col - tile.col);
    if (dr + dc !== 1){
      deselect();
      selected = tile;
      tile.selected = true;
      tile.el.classList.add('selected');
      updateTilePosition(tile, true);
      return;
    }
    const t1 = selected, t2 = tile;
    deselect();
    attemptSwap(t1, t2);
  }

  function deselect(){
    if (selected){
      selected.selected = false;
      selected.el.classList.remove('selected');
      updateTilePosition(selected, true);
      selected = null;
    }
  }

  function swapData(t1, t2){
    const r1=t1.row, c1=t1.col, r2=t2.row, c2=t2.col;
    grid[r1][c1] = t2; grid[r2][c2] = t1;
    t1.row = r2; t1.col = c2;
    t2.row = r1; t2.col = c1;
  }

  async function attemptSwap(t1, t2){
    busy = true;
    swapData(t1, t2);
    updateTilePosition(t1, true);
    updateTilePosition(t2, true);
    await wait(280);

    const matches = findMatches();
    if (matches.size === 0){
      t1.el.classList.add('invalid-shake');
      t2.el.classList.add('invalid-shake');
      swapData(t1, t2);
      updateTilePosition(t1, true);
      updateTilePosition(t2, true);
      await wait(300);
      t1.el.classList.remove('invalid-shake');
      t2.el.classList.remove('invalid-shake');
      busy = false;
      return;
    }

    movesLeft--;
    updateHUD();
    await resolveMatches(matches, 1);
    busy = false;
    checkEndConditions();
  }

  function findMatches(){
    const matched = new Set();
    for (let r = 0; r < ROWS; r++){
      let runStart = 0;
      for (let c = 1; c <= COLS; c++){
        const cur = c < COLS ? grid[r][c] : null;
        const prev = grid[r][c-1];
        if (cur && prev && cur.type === prev.type) continue;
        const runLen = c - runStart;
        if (runLen >= 3) for (let k = runStart; k < c; k++) matched.add(grid[r][k]);
        runStart = c;
      }
    }
    for (let c = 0; c < COLS; c++){
      let runStart = 0;
      for (let r = 1; r <= ROWS; r++){
        const cur = r < ROWS ? grid[r][c] : null;
        const prev = grid[r-1][c];
        if (cur && prev && cur.type === prev.type) continue;
        const runLen = r - runStart;
        if (runLen >= 3) for (let k = runStart; k < r; k++) matched.add(grid[k][c]);
        runStart = r;
      }
    }
    return matched;
  }

  async function resolveMatches(matched, chain){
    const byType = {};
    matched.forEach(tile => {
      byType[tile.type] = (byType[tile.type] || 0) + 1;
      const x = tile.col * cellSize + 3;
      const y = tile.row * cellSize + 3;
      tile.el.style.transform = `translate(${x}px, ${y}px) scale(0.15)`;
      tile.el.style.opacity = '0';
    });

    score += matched.size * 10 * chain;
    catsCollected += byType[CAT_TYPE] || 0;
    updateHUD();
    if (chain > 1) showToast(chain === 2 ? 'Combo! ✨' : `Combo x${chain}! 🔥`);

    await wait(240);
    matched.forEach(tile => {
      grid[tile.row][tile.col] = null;
      tile.el.remove();
    });

    applyGravityAndRefill();
    await wait(340);

    const next = findMatches();
    if (next.size > 0){
      await resolveMatches(next, chain + 1);
    }
  }

  function applyGravityAndRefill(){
    for (let c = 0; c < COLS; c++){
      const colTiles = [];
      for (let r = 0; r < ROWS; r++) if (grid[r][c]) colTiles.push(grid[r][c]);
      for (let r = 0; r < ROWS; r++) grid[r][c] = null;

      let writeRow = ROWS - 1;
      for (let i = colTiles.length - 1; i >= 0; i--){
        const tile = colTiles[i];
        tile.row = writeRow;
        grid[writeRow][c] = tile;
        writeRow--;
      }
      const missing = writeRow + 1;
      for (let r = writeRow; r >= 0; r--){
        const tile = createTile(r, c, randType(), missing);
        grid[r][c] = tile;
      }
    }
    requestAnimationFrame(() => {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          updateTilePosition(grid[r][c], true);
    });
  }

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1300);
  }

  function updateHUD(){
    levelValue.textContent = level;
    movesValue.textContent = Math.max(0, movesLeft);
    scoreValue.textContent = score;
    goalCount.textContent = `${Math.min(catsCollected, goalTarget)}/${goalTarget}`;
    goalFill.style.width = Math.min(100, (catsCollected / goalTarget) * 100) + '%';
  }

  function checkEndConditions(){
    if (catsCollected >= goalTarget){
      showOverlay('win');
    } else if (movesLeft <= 0){
      showOverlay('lose');
    }
  }

  function showOverlay(kind){
    if (kind === 'win'){
      overlayEmoji.textContent = '🎉';
      overlayTitle.textContent = 'Nível completo!';
      overlayText.textContent = `Libertaste ${goalTarget} gatinhos com ${movesLeft} jogadas de sobra.`;
      overlayBtn.textContent = 'Próximo nível';
      overlayBtn.onclick = () => { level++; startLevel(level); };
    } else {
      overlayEmoji.textContent = '😿';
      overlayTitle.textContent = 'Ficaste sem jogadas';
      overlayText.textContent = `Salvaste ${catsCollected} de ${goalTarget} gatinhos. Tenta outra vez!`;
      overlayBtn.textContent = 'Tentar de novo';
      overlayBtn.onclick = () => startLevel(level);
    }
    overlayEl.classList.add('show');
  }

  function hideOverlay(){
    overlayEl.classList.remove('show');
  }

  function startLevel(lv){
    const cfg = levelConfig(lv);
    level = lv;
    goalTarget = cfg.target;
    movesLeft = cfg.moves;
    catsCollected = 0;
    selected = null;
    busy = false;
    hideOverlay();
    buildBoard();
    updateHUD();
  }

  resetBtn.addEventListener('click', () => {
    score = 0;
    startLevel(1);
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(recalcSize, 120);
  });

  startLevel(1);
})();
</script>
</body>
